<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 376" width="620" height="376" role="img" aria-label="Sketch of the progress toolbar">
  <title>Sketch of the progress toolbar</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style>
    .ink   { fill:none; stroke:#2f2a24; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .thin  { fill:none; stroke:#2f2a24; stroke-width:1.3; stroke-linecap:round; }
    .fade  { fill:none; stroke:#9a9086; stroke-width:1.3; stroke-linecap:round; }
    .fill  { fill:#f0ebe0; stroke:#2f2a24; stroke-width:2; }
    .amber { fill:#e0a458; stroke:#2f2a24; stroke-width:1.5; }
    .green { fill:#7fb069; stroke:#2f2a24; stroke-width:1.5; }
    .rust  { fill:#c0674f; stroke:#2f2a24; stroke-width:1.5; }
    .paper { fill:#fffdf7; stroke:#2f2a24; stroke-width:2.4; }
    text   { font-family:'Comic Sans MS','Bradley Hand','Segoe Print','Chalkboard SE',cursive; fill:#2f2a24; }
    .t     { font-size:13px; }
    .s     { font-size:11px; fill:#6a6355; }
    .lbl   { font-size:12px; fill:#a5641b; }
    .mono  { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; fill:#6a6355; }
    .head  { font-size:16px; }
  </style>
  <rect width="620" height="376" fill="#f5f2ea"/>
  <g filter="url(#rough)">

    <text class="head" x="30" y="34">Saving progress, and the theme</text>

    <rect class="fill" x="30" y="58" width="112" height="26" rx="3"/>
    <text class="s" x="40" y="75">load progress…</text>
    <rect class="fill" x="150" y="58" width="106" height="26" rx="3"/>
    <text class="s" x="160" y="75">save progress</text>
    <rect class="fill" x="264" y="58" width="72" height="26" rx="3"/>
    <text class="s" x="274" y="75">save as…</text>
    <text class="lbl" x="348" y="75">· git-drill-progress.json</text>

    <rect class="fill" x="444" y="58" width="146" height="26" rx="4"/>
    <line class="thin" x1="492" y1="58" x2="492" y2="84"/>
    <line class="thin" x1="540" y1="58" x2="540" y2="84"/>
    <rect class="amber" x="444" y="58" width="48" height="26" rx="4"/>
    <text class="s" x="456" y="75">auto</text>
    <text class="s" x="500" y="75">light</text>
    <text class="s" x="550" y="75">dark</text>
    <path class="fade" d="M516 106 C 516 96, 516 92, 516 86"/>
    <text class="lbl" x="440" y="122">auto follows your system</text>

    <!-- what the file holds -->
    <rect class="paper" x="30" y="146" width="250" height="150" rx="6"/>
    <text class="t" x="46" y="172">one file holds</text>
    <circle class="green" cx="54" cy="196" r="5"/>
    <text class="s" x="70" y="200">every card you graded</text>
    <circle class="green" cx="54" cy="222" r="5"/>
    <text class="s" x="70" y="226">every lab step you ticked</text>
    <circle class="green" cx="54" cy="248" r="5"/>
    <text class="s" x="70" y="252">your theme choice</text>
    <text class="s" x="46" y="280">nothing is stored in the browser</text>

    <path class="fade" d="M300 220 C 316 220, 326 220, 340 220"/>
    <path class="fade" d="M334 214 L 342 220 L 334 226"/>

    <rect class="paper" x="356" y="146" width="234" height="150" rx="6"/>
    <text class="t" x="372" y="172">keep it wherever</text>
    <text class="s" x="372" y="198">a folder, a USB stick,</text>
    <text class="s" x="372" y="220">or committed next to</text>
    <text class="s" x="372" y="242">your notes</text>
    <text class="s" x="372" y="272">load it again on any machine</text>

    <text class="lbl" x="30" y="330">Chrome and Edge let you overwrite the same file each time.</text>
    <text class="lbl" x="30" y="352">Firefox downloads a fresh copy instead — same file, same result.</text>
  </g>
</svg>
