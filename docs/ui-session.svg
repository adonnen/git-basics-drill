<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" role="img" aria-label="Sketch of the session panel offering resume or a new session">
  <title>Sketch of the session panel: resume, or start a new session</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style>
    .ink   { fill:none; stroke:#2f2a24; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .thin  { fill:none; stroke:#2f2a24; stroke-width:1.3; stroke-linecap:round; }
    .fade  { fill:none; stroke:#9a9086; stroke-width:1.3; stroke-linecap:round; }
    .fill  { fill:#f0ebe0; stroke:#2f2a24; stroke-width:2; }
    .gbtn  { fill:#eaf1e4; stroke:#3d6a2b; stroke-width:2; }
    .paper { fill:#fffdf7; stroke:#2f2a24; stroke-width:2.4; }
    text   { font-family:'Comic Sans MS','Bradley Hand','Segoe Print','Chalkboard SE',cursive; fill:#2f2a24; }
    .t     { font-size:13px; }
    .s     { font-size:11px; fill:#6a6355; }
    .g     { font-size:11px; fill:#3d6a2b; }
    .lbl   { font-size:12px; fill:#a5641b; }
    .mono  { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; fill:#6a6355; }
    .head  { font-size:16px; }
  </style>
  <rect width="620" height="420" fill="#f5f2ea"/>
  <g filter="url(#rough)">

    <text class="head" x="30" y="34">Coming back</text>
    <text class="s" x="30" y="54">the browser keeps your session; reopening the page asks before touching it</text>

    <!-- the page behind, drawn faint: it is there, and it does nothing -->
    <g opacity="0.4">
      <rect class="fade" x="30" y="76" width="560" height="250" rx="6"/>
      <line class="fade" x1="50" y1="100" x2="250" y2="100"/>
      <rect class="fade" x="470" y="90" width="100" height="22" rx="3"/>
      <rect class="fade" x="50" y="126" width="520" height="180" rx="6"/>
      <line class="fade" x1="72" y1="160" x2="430" y2="160"/>
      <line class="fade" x1="72" y1="182" x2="360" y2="182"/>
      <line class="fade" x1="72" y1="272" x2="240" y2="272"/>
    </g>

    <!-- the panel that comes up in front of it -->
    <rect class="paper" x="140" y="120" width="340" height="170" rx="8"/>
    <line class="thin" x1="140" y1="150" x2="480" y2="150"/>
    <circle class="thin" cx="158" cy="135" r="3.5"/>
    <circle class="thin" cx="170" cy="135" r="3.5"/>
    <circle class="thin" cx="182" cy="135" r="3.5"/>
    <text class="mono" x="200" y="139">session</text>

    <text class="t" x="160" y="180">Carry on where you left off?</text>
    <text class="s" x="160" y="204">17 cards graded, 2 lab steps done,</text>
    <text class="s" x="160" y="220">kept in this browser 3 hours ago</text>

    <rect class="gbtn" x="160" y="238" width="80" height="26" rx="4"/>
    <text class="g" x="176" y="255">resume</text>
    <rect class="fill" x="252" y="238" width="106" height="26" rx="4"/>
    <text class="s" x="264" y="255">new session</text>

    <path class="fade" d="M502 196 C 494 196, 488 190, 484 186"/>
    <text class="lbl" x="508" y="182">the page behind</text>
    <text class="lbl" x="508" y="198">is dimmed, and</text>
    <text class="lbl" x="508" y="214">stays out of reach</text>

    <text class="lbl" x="30" y="356">resume — back to your first ungraded card, theme and all</text>
    <text class="lbl" x="30" y="378">new session — starts clean, and discards what was kept</text>
    <text class="s" x="30" y="402">written as you go: every grade, every lab step ticked, the theme</text>
  </g>
</svg>
