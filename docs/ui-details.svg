<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 384" width="620" height="384" role="img" aria-label="Sketch of the details pop-up">
  <title>Sketch of the details pop-up</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style>
    .ink   { fill:none; stroke:#2f2a24; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .thin  { fill:none; stroke:#2f2a24; stroke-width:1.3; stroke-linecap:round; }
    .fade  { fill:none; stroke:#9a9086; stroke-width:1.3; stroke-linecap:round; }
    .fill  { fill:#f0ebe0; stroke:#2f2a24; stroke-width:2; }
    .amber { fill:#e0a458; stroke:#2f2a24; stroke-width:1.5; }
    .green { fill:#7fb069; stroke:#2f2a24; stroke-width:1.5; }
    .rust  { fill:#c0674f; stroke:#2f2a24; stroke-width:1.5; }
    .paper { fill:#fffdf7; stroke:#2f2a24; stroke-width:2.4; }
    text   { font-family:'Comic Sans MS','Bradley Hand','Segoe Print','Chalkboard SE',cursive; fill:#2f2a24; }
    .t     { font-size:13px; }
    .s     { font-size:11px; fill:#6a6355; }
    .lbl   { font-size:12px; fill:#a5641b; }
    .mono  { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; fill:#6a6355; }
    .head  { font-size:16px; }
  </style>
  <rect width="620" height="384" fill="#f5f2ea"/>
  <g filter="url(#rough)">

    <text class="head" x="30" y="34">The details pop-up</text>
    <text class="s" x="30" y="54">press d, or the "details" button, once the answer is showing</text>

    <!-- The panel stops at 440 so that the annotations down the right have a
         margin of their own. Nothing is allowed to sit on the outline. -->
    <rect class="paper" x="30" y="72" width="410" height="290" rx="8"/>
    <line class="thin" x1="30" y1="100" x2="440" y2="100"/>
    <circle class="thin" cx="46" cy="86" r="4"/>
    <circle class="thin" cx="60" cy="86" r="4"/>
    <circle class="thin" cx="74" cy="86" r="4"/>
    <text class="mono" x="94" y="90">02 branching</text>
    <rect class="fill" x="396" y="76" width="34" height="20" rx="3"/>
    <text class="s" x="404" y="90">esc</text>

    <line class="ink" x1="52" y1="124" x2="330" y2="124"/>
    <text class="s" x="52" y="146">the fine print — caveats and</text>
    <text class="s" x="52" y="162">the reason behind the rule</text>
    <line class="thin" x1="52" y1="180" x2="400" y2="180"/>
    <line class="thin" x1="52" y1="194" x2="360" y2="194"/>

    <rect class="fill" x="52" y="210" width="366" height="72" rx="5"/>
    <text class="mono" x="66" y="232">before: A---B---C (main)---D---E</text>
    <text class="mono" x="66" y="250">after : A---B---C---D---E</text>
    <text class="mono" x="66" y="268">                  ^ main, feature</text>
    <path class="fade" d="M474 244 C 460 244, 448 244, 440 244"/>
    <text class="lbl" x="480" y="248">an ASCII figure</text>

    <rect class="fill" x="52" y="296" width="210" height="26" rx="4"/>
    <text class="s" x="62" y="313">Pro Git 3.1 — Branches… ↗</text>
    <rect class="fill" x="52" y="330" width="270" height="26" rx="4"/>
    <text class="s" x="62" y="347">Git from the Bottom Up — commits ↗</text>
    <path class="fade" d="M474 330 C 440 330, 400 330, 332 340"/>
    <text class="lbl" x="480" y="322">deep links into</text>
    <text class="lbl" x="480" y="338">the exact section</text>
    <text class="lbl" x="480" y="354">of each book</text>
  </g>
</svg>
