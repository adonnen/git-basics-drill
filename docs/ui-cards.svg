<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 424" width="620" height="424" role="img" aria-label="Sketch of the cards view">
  <title>Sketch of the cards view</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style>
    .ink   { fill:none; stroke:#2f2a24; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .thin  { fill:none; stroke:#2f2a24; stroke-width:1.3; stroke-linecap:round; }
    .fade  { fill:none; stroke:#9a9086; stroke-width:1.3; stroke-linecap:round; }
    .fill  { fill:#f0ebe0; stroke:#2f2a24; stroke-width:2; }
    .amber { fill:#e0a458; stroke:#2f2a24; stroke-width:1.5; }
    .green { fill:#7fb069; stroke:#2f2a24; stroke-width:1.5; }
    .rust  { fill:#c0674f; stroke:#2f2a24; stroke-width:1.5; }
    .paper { fill:#fffdf7; stroke:#2f2a24; stroke-width:2.4; }
    text   { font-family:'Comic Sans MS','Bradley Hand','Segoe Print','Chalkboard SE',cursive; fill:#2f2a24; }
    .t     { font-size:13px; }
    .s     { font-size:11px; fill:#6a6355; }
    .lbl   { font-size:12px; fill:#a5641b; }
    .mono  { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; fill:#6a6355; }
    .head  { font-size:16px; }
  </style>
  <rect width="620" height="424" fill="#f5f2ea"/>
  <g filter="url(#rough)">

    <text class="head" x="30" y="34">The cards view</text>

    <!-- view switch -->
    <rect class="fill" x="470" y="18" width="120" height="26" rx="4"/>
    <line class="thin" x1="530" y1="18" x2="530" y2="44"/>
    <rect class="amber" x="470" y="18" width="60" height="26" rx="4"/>
    <text class="t" x="484" y="36">cards</text>
    <text class="t" x="548" y="36">lab</text>
    <text class="lbl" x="440" y="66" text-anchor="end">switch views here →</text>

    <!-- stage chips -->
    <rect class="amber" x="30" y="76" width="40" height="22" rx="3"/>
    <text class="s" x="40" y="91">all</text>
    <rect class="fill" x="78" y="76" width="96" height="22" rx="3"/>
    <text class="s" x="86" y="91">01 foundations</text>
    <rect class="fill" x="182" y="76" width="86" height="22" rx="3"/>
    <text class="s" x="190" y="91">02 branching</text>
    <rect class="fill" x="276" y="76" width="70" height="22" rx="3"/>
    <text class="s" x="284" y="91">03 stashing</text>
    <text class="s" x="356" y="91">…</text>
    <text class="lbl" x="380" y="91">drill one stage at a time</text>

    <!-- the card -->
    <rect class="paper" x="30" y="118" width="380" height="176" rx="8"/>
    <line class="thin" x1="30" y1="146" x2="410" y2="146"/>
    <circle class="thin" cx="46" cy="132" r="4"/>
    <circle class="thin" cx="60" cy="132" r="4"/>
    <circle class="thin" cx="74" cy="132" r="4"/>
    <text class="mono" x="170" y="136">~/git-drill/02-branching.card</text>
    <text class="mono" x="366" y="136">7/10</text>

    <text class="lbl" x="48" y="172">QUESTION</text>
    <line class="ink" x1="48" y1="192" x2="380" y2="192"/>
    <line class="ink" x1="48" y1="210" x2="356" y2="210"/>
    <line class="ink" x1="48" y1="228" x2="300" y2="228"/>

    <text class="s" x="48" y="278">space — flip</text>
    <rect class="fill" x="316" y="262" width="78" height="22" rx="3"/>
    <text class="s" x="326" y="277">details ⌄</text>

    <!-- annotation to the card -->
    <path class="fade" d="M440 190 C 424 190, 420 200, 414 205"/>
    <text class="lbl" x="446" y="186">click or press space</text>
    <text class="lbl" x="446" y="202">to see the answer</text>

    <path class="fade" d="M430 272 C 418 272, 410 272, 398 272"/>
    <text class="lbl" x="436" y="276">opens the pop-up</text>

    <!-- grading buttons -->
    <rect class="rust"  x="118" y="312" width="76" height="30" rx="4"/>
    <text class="t" x="138" y="332">again</text>
    <rect class="green" x="206" y="312" width="76" height="30" rx="4"/>
    <text class="t" x="222" y="332">got it</text>
    <rect class="fill" x="62" y="312" width="44" height="30" rx="4"/>
    <text class="t" x="78" y="332">←</text>
    <rect class="fill" x="294" y="312" width="44" height="30" rx="4"/>
    <text class="t" x="310" y="332">→</text>
    <path class="fade" d="M360 330 C 348 330, 344 328, 338 328"/>
    <text class="lbl" x="366" y="326">grade honestly —</text>
    <text class="lbl" x="366" y="342">"again" cards come back</text>

    <!-- progress graph -->
    <text class="s" x="30" y="378">progress graph — one dot per card, gaps mark stages</text>
    <circle class="green" cx="32" cy="396" r="5.5"/>
    <circle class="green" cx="47" cy="396" r="5.5"/>
    <circle class="green" cx="62" cy="396" r="5.5"/>
    <circle class="green" cx="77" cy="396" r="5.5"/>
    <circle class="green" cx="92" cy="396" r="5.5"/>
    <circle class="green" cx="107" cy="396" r="5.5"/>
    <circle class="green" cx="122" cy="396" r="5.5"/>
    <circle class="green" cx="137" cy="396" r="5.5"/>
    <circle class="green" cx="152" cy="396" r="5.5"/>
    <circle class="rust" cx="167" cy="396" r="5.5"/>
    <circle class="fill" cx="182" cy="396" r="5.5"/>
    <circle class="fill" cx="209" cy="396" r="5.5"/>
    <circle class="fill" cx="224" cy="396" r="5.5"/>
    <circle class="fill" cx="239" cy="396" r="5.5"/>
    <circle class="rust" cx="254" cy="396" r="5.5"/>
    <circle class="fill" cx="269" cy="396" r="5.5"/>
    <circle class="fill" cx="284" cy="396" r="5.5"/>
    <circle class="fill" cx="299" cy="396" r="5.5"/>
    <circle class="fill" cx="314" cy="396" r="5.5"/>
    <circle class="fill" cx="329" cy="396" r="5.5"/>
    <circle class="fill" cx="344" cy="396" r="5.5"/>
    <circle class="fill" cx="359" cy="396" r="5.5"/>
    <circle class="fill" cx="386" cy="396" r="5.5"/>
    <circle class="fill" cx="401" cy="396" r="5.5"/>
    <circle class="fill" cx="416" cy="396" r="5.5"/>
    <circle class="fill" cx="431" cy="396" r="5.5"/>
    <circle class="fill" cx="446" cy="396" r="5.5"/>
    <circle class="fill" cx="461" cy="396" r="5.5"/>
    <circle class="fill" cx="476" cy="396" r="5.5"/>
    <circle class="fill" cx="491" cy="396" r="5.5"/>
    <circle class="fill" cx="506" cy="396" r="5.5"/>
    <circle class="fill" cx="521" cy="396" r="5.5"/>
    <circle class="fill" cx="536" cy="396" r="5.5"/>
    <circle class="fill" cx="551" cy="396" r="5.5"/>
  </g>
</svg>
